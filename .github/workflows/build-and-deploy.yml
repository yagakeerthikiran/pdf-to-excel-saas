name: Build and Deploy to AWS ECS

on:
  push:
    branches:
      - 'feat/infrastructure-clean'
      - 'main'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - staging
        - production

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 654499586766.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPOSITORY_FRONTEND: pdf-excel-saas-frontend
  ECR_REPOSITORY_BACKEND: pdf-excel-saas-backend
  ECS_CLUSTER: pdf-excel-saas-prod
  ECS_SERVICE_FRONTEND: pdf-excel-saas-prod-frontend
  ECS_SERVICE_BACKEND: pdf-excel-saas-prod-backend
  IMAGE_TAG: ${{ github.sha }}
  PARAM_PREFIX: /pdf-excel-saas/prod

jobs:
  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ AWS credentials not configured"
            exit 1
          fi
          echo "✅ Environment validation passed"

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: validate-environment
    outputs:
      frontend-image: ${{ steps.build-frontend.outputs.image }}
      backend-image: ${{ steps.build-backend.outputs.image }}
      image-tag: ${{ env.IMAGE_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.simple
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.simple
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch environment variables from Parameter Store
        id: fetch-params
        run: |
          echo "🔐 Fetching configuration from AWS Parameter Store..."
          
          # Function to get parameter (with fallback)
          get_param() {
            local param_name="$1"
            local fallback_value="$2"
            local value=$(aws ssm get-parameter --region ${{ env.AWS_REGION }} --name "${{ env.PARAM_PREFIX }}/$param_name" --query 'Parameter.Value' --output text 2>/dev/null || echo "$fallback_value")
            echo "$value"
          }

          # Fetch basic parameters with fallbacks
          APP_URL=$(get_param "app/frontend-url" "http://pdf-excel-saas-prod-alb-1547358143.ap-southeast-2.elb.amazonaws.com")
          BACKEND_URL=$(get_param "app/backend-url" "http://pdf-excel-saas-prod-alb-1547358143.ap-southeast-2.elb.amazonaws.com/api")
          JWT_SECRET=$(get_param "security/jwt-secret" "fallback_jwt_secret_min_32_chars_required")
          S3_BUCKET=$(get_param "aws/s3-bucket" "pdf-excel-saas-prod")

          # Set outputs for use in later steps
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "jwt_secret=$JWT_SECRET" >> $GITHUB_OUTPUT
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT

          # Try to fetch optional Supabase parameters
          SUPABASE_URL=$(get_param "supabase/url" "")
          SUPABASE_ANON_KEY=$(get_param "supabase/anon-key" "")
          STRIPE_PUBLISHABLE_KEY=$(get_param "stripe/publishable-key" "")
          
          echo "supabase_url=$SUPABASE_URL" >> $GITHUB_OUTPUT
          echo "supabase_anon_key=$SUPABASE_ANON_KEY" >> $GITHUB_OUTPUT
          echo "stripe_publishable_key=$STRIPE_PUBLISHABLE_KEY" >> $GITHUB_OUTPUT

          echo "✅ Configuration fetched successfully"

      - name: Check if ECS cluster exists
        id: check-cluster
        run: |
          if aws ecs describe-clusters --clusters ${{ env.ECS_CLUSTER }} --query 'clusters[0].status' --output text | grep -q "ACTIVE"; then
            echo "cluster-exists=true" >> $GITHUB_OUTPUT
            echo "✅ ECS cluster ${{ env.ECS_CLUSTER }} is active"
          else
            echo "cluster-exists=false" >> $GITHUB_OUTPUT
            echo "❌ ECS cluster ${{ env.ECS_CLUSTER }} not found or inactive"
          fi

      - name: Update ECS service - Frontend
        if: steps.check-cluster.outputs.cluster-exists == 'true'
        run: |
          echo "🚀 Updating frontend service with image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }}"
          
          # Get current task definition
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE_FRONTEND }} \
            --query 'taskDefinition' > task-def.json

          # Build comprehensive environment variables array for frontend
          ENV_VARS='[
            {"name": "NEXT_PUBLIC_APP_URL", "value": "${{ steps.fetch-params.outputs.app_url }}"},
            {"name": "BACKEND_URL", "value": "${{ steps.fetch-params.outputs.backend_url }}"},
            {"name": "NODE_ENV", "value": "production"}
          ]'

          # Add optional Supabase variables if available
          if [ -n "${{ steps.fetch-params.outputs.supabase_url }}" ]; then
            ENV_VARS=$(echo $ENV_VARS | jq '. + [{"name": "NEXT_PUBLIC_SUPABASE_URL", "value": "${{ steps.fetch-params.outputs.supabase_url }}"}]')
          fi

          if [ -n "${{ steps.fetch-params.outputs.supabase_anon_key }}" ]; then
            ENV_VARS=$(echo $ENV_VARS | jq '. + [{"name": "NEXT_PUBLIC_SUPABASE_ANON_KEY", "value": "${{ steps.fetch-params.outputs.supabase_anon_key }}"}]')
          fi

          if [ -n "${{ steps.fetch-params.outputs.stripe_publishable_key }}" ]; then
            ENV_VARS=$(echo $ENV_VARS | jq '. + [{"name": "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY", "value": "${{ steps.fetch-params.outputs.stripe_publishable_key }}"}]')
          fi

          # Update task definition
          cat task-def.json | jq \
            --arg IMAGE "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ env.IMAGE_TAG }}" \
            --argjson ENV_VARS "$ENV_VARS" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy) | 
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = $ENV_VARS' > new-task-def.json

          # Register and update
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "✅ Registered new frontend task definition: $NEW_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_FRONTEND }} \
            --task-definition $NEW_TASK_DEF_ARN \
            --force-new-deployment

      - name: Update ECS service - Backend
        if: steps.check-cluster.outputs.cluster-exists == 'true'
        run: |
          echo "🚀 Updating backend service with image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }}"
          
          # Get current task definition
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE_BACKEND }} \
            --query 'taskDefinition' > backend-task-def.json

          # Get secure parameters for backend
          DATABASE_URL=$(aws ssm get-parameter --region ${{ env.AWS_REGION }} --name "${{ env.PARAM_PREFIX }}/database/url" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "postgresql://placeholder:password@localhost:5432/pdfexcel")
          STRIPE_SECRET=$(aws ssm get-parameter --region ${{ env.AWS_REGION }} --name "${{ env.PARAM_PREFIX }}/stripe/secret-key" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          SUPABASE_SERVICE_KEY=$(aws ssm get-parameter --region ${{ env.AWS_REGION }} --name "${{ env.PARAM_PREFIX }}/supabase/service-key" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")

          # Build environment variables for backend
          ENV_VARS='[
            {"name": "AWS_ACCESS_KEY_ID", "value": "${{ secrets.AWS_ACCESS_KEY_ID }}"},
            {"name": "AWS_SECRET_ACCESS_KEY", "value": "${{ secrets.AWS_SECRET_ACCESS_KEY }}"},
            {"name": "AWS_REGION", "value": "ap-southeast-2"},
            {"name": "AWS_S3_BUCKET_NAME", "value": "${{ steps.fetch-params.outputs.s3_bucket }}"},
            {"name": "JWT_SECRET_KEY", "value": "${{ steps.fetch-params.outputs.jwt_secret }}"},
            {"name": "DATABASE_URL", "value": "'$DATABASE_URL'"},
            {"name": "ENVIRONMENT", "value": "production"}
          ]'

          # Add optional secure variables if available
          if [ -n "$STRIPE_SECRET" ]; then
            ENV_VARS=$(echo $ENV_VARS | jq '. + [{"name": "STRIPE_SECRET_KEY", "value": "'$STRIPE_SECRET'"}]')
          fi

          if [ -n "$SUPABASE_SERVICE_KEY" ]; then
            ENV_VARS=$(echo $ENV_VARS | jq '. + [{"name": "SUPABASE_SERVICE_ROLE_KEY", "value": "'$SUPABASE_SERVICE_KEY'"}]')
          fi

          # Update task definition
          cat backend-task-def.json | jq \
            --arg IMAGE "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ env.IMAGE_TAG }}" \
            --argjson ENV_VARS "$ENV_VARS" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy) | 
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = $ENV_VARS' > new-backend-task-def.json

          # Register and update
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-backend-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "✅ Registered new backend task definition: $NEW_TASK_DEF_ARN"

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --task-definition $NEW_TASK_DEF_ARN \
            --force-new-deployment

      - name: Wait for deployment completion
        if: steps.check-cluster.outputs.cluster-exists == 'true'
        run: |
          echo "⏳ Waiting for services to stabilize..."
          
          echo "🔍 Waiting for frontend deployment..."
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_FRONTEND }}
          echo "✅ Frontend deployment completed"
          
          echo "🔍 Waiting for backend deployment..."
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_BACKEND }}
          echo "✅ Backend deployment completed"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-ecs]
    if: always() && needs.deploy-to-ecs.result == 'success'
    steps:
      - name: Wait for services to be ready
        run: |
          echo "⏳ Waiting 60 seconds for services to fully start..."
          sleep 60

      - name: Health check - Application
        run: |
          ALB_URL="http://pdf-excel-saas-prod-alb-1547358143.ap-southeast-2.elb.amazonaws.com"
          echo "🏥 Testing application at: $ALB_URL"
          
          for i in {1..15}; do
            echo "🔄 Health check attempt $i/15..."
            
            if curl -f -s --max-time 30 "$ALB_URL" > /dev/null; then
              echo "✅ Frontend health check passed!"
              break
            elif curl -f -s --max-time 30 "$ALB_URL/api/health" > /dev/null; then
              echo "✅ Backend API health check passed!"
              break
            else
              echo "❌ Attempt $i failed, retrying in 20 seconds..."
              if [ $i -eq 15 ]; then
                echo "🚨 Health check failed after all attempts"
                exit 1
              fi
              sleep 20
            fi
          done

  post-deployment:
    name: Post Deployment Tasks
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-ecs, health-check]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 📋 Deployment Summary"
          echo "**Status**: ${{ needs.health-check.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
          echo "**Images Built**: ${{ needs.build-and-push.result == 'success' && '✅' || '❌' }}"
          echo "**ECS Updated**: ${{ needs.deploy-to-ecs.result == 'success' && '✅' || '❌' }}"
          echo "**Health Check**: ${{ needs.health-check.result == 'success' && '✅' || '❌' }}"
          echo ""
          echo "🌐 **Application URL**: http://pdf-excel-saas-prod-alb-1547358143.ap-southeast-2.elb.amazonaws.com/"
          echo "📦 **Image Tag**: ${{ env.IMAGE_TAG }}"
          echo ""
          if [ "${{ needs.health-check.result }}" == "success" ]; then
            echo "🎉 **Deployment successful with Parameter Store configuration!**"
          else
            echo "🚨 **Deployment issues detected - check logs**"
          fi